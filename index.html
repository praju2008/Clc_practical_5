<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>
    
    <!-- Subheading -->
    <h2>About This Page</h2>
    
    <!-- Paragraph text with bold and italic formatting -->
    <p>This is a sample paragraph demonstrating basic HTML syntax. You can make text <strong>bold</strong> or <em>italicized</em> easily.</p>
    
    <!-- Hyperlink -->
    <p>Visit the official website of <a href="https://www.w3schools.com" target="_blank">W3Schools</a> for more tutorials.</p>
    
    <!-- Image placeholder -->
    <h2>Sample Image</h2>
    <img src="https://placeholder.com" alt="A simple placeholder image" width="300" height="150">

    <!-- Unordered List -->
    <h2>My Favorite Fruits</h2>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Oranges</li>
    </ul>

</body>
</html>
